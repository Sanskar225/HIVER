[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amazonhelp-support-agent"
version = "1.1.0"
description = "Deterministic Triage Engine and AI Customer Support Agent for @AmazonHelp"
readme = "README.md"
requires-python = ">=3.9, <3.15"
dependencies = [
    "pandas>=2.0.0,<4.0.0",
    "numpy>=1.24.0,<3.0.0",
    "scikit-learn>=1.2.0,<2.0.0",
    "scipy>=1.10.0,<2.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "pyarrow>=14.0.0,<30.0.0",
    "httpx>=0.24.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.22.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<11.0.0",
]
